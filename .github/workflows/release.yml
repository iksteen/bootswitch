name: Publish release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish EFI and firmware
    needs: build
    runs-on: ubuntu-24.04
    environment: firmware-signing
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install signing dependencies
        run: python -m pip install -r requirements-signing.txt
      - name: Download EFI binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-efi-x64
          path: dist
      - name: Download firmware binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-firmware-sticks3
          path: dist
      - name: Download development firmware binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-firmware-sticks3-dev
          path: dist
      - name: Download T-QT firmware binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-firmware-tqt
          path: dist
      - name: Download T-QT development firmware binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-firmware-tqt-dev
          path: dist
      # Environment protection gates this job before its signing key is released.
      # The key is passed only to this step, after all tests, on a version tag.
      # Branch/PR builds and development images never receive this secret.
      - name: Sign production USB updates
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [[ -z "$FIRMWARE_SIGNING_KEY" ]]; then
            echo 'FIRMWARE_SIGNING_KEY is required in the firmware-signing environment.' >&2
            exit 1
          fi
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/bootswitch-signing.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$FIRMWARE_SIGNING_KEY" > "$key_file"
          for board in sticks3 tqt; do
            python scripts/firmware_signing.py sign "dist/bootswitch-${board}.bin" \
              --private-key "$key_file" --output "dist/update-${board}.bin"
            python scripts/firmware_signing.py verify "dist/update-${board}.bin"
          done
      - name: Checksums and release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            bootswitchx64.efi
            bootswitch-sticks3.bin bootswitch-sticks3-flash.zip
            update-sticks3.bin
            bootswitch-tqt.bin bootswitch-tqt-flash.zip
            update-tqt.bin
            bootswitch-tqt-dev.bin bootswitch-tqt-dev-flash.zip
            bootswitch-sticks3-dev.bin bootswitch-sticks3-dev-flash.zip
          )
          sha256sum "${assets[@]}" > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "BootSwitch $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
