name: Publish release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish EFI and firmware
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download EFI binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-efi-x64
          path: dist
      - name: Download firmware binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-firmware-sticks3
          path: dist
      - name: Download development firmware binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootswitch-firmware-sticks3-dev
          path: dist
      - name: Checksums and release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            bootswitchx64.efi
            bootswitch-sticks3.bin bootswitch-sticks3-flash.zip
            bootswitch-sticks3-dev.bin bootswitch-sticks3-dev-flash.zip
          )
          sha256sum "${assets[@]}" > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "BootSwitch $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
