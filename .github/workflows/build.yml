name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  efi:
    name: EFI bridge and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gnu-efi dosfstools mtools qemu-system-x86 ovmf systemd-boot-efi
      - name: Native tests
        run: make test
      - name: EFI integration tests
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: python3 tests/check_efi.py
      - name: Upload EFI binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootswitch-efi-x64
          path: efi/build/bootswitchx64.efi
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: StickS3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build and package firmware
        run: pio run --environment sticks3 --target release
      - name: Build and package development firmware
        run: pio run --environment sticks3-dev --target release
      - name: Check firmware features and packages
        run: python3 tests/check_firmware_features.py
      - name: Upload firmware binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootswitch-firmware-sticks3
          path: |
            build/release/bootswitch-sticks3.bin
            build/release/bootswitch-sticks3-flash.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload development firmware binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootswitch-firmware-sticks3-dev
          path: |
            build/release/sticks3-dev/bootswitch-sticks3-dev.bin
            build/release/sticks3-dev/bootswitch-sticks3-dev-flash.zip
          if-no-files-found: error
          retention-days: 30
