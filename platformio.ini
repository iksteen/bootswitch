[platformio]
default_envs = sticks3

[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:scripts/package_firmware.py
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
; Keep the APB at 80 MHz for USB/SPI while reducing CPU power from 240 MHz.
board_build.f_cpu = 80000000L
build_unflags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    m5stack/M5Unified@0.2.27
    m5stack/M5GFX@0.2.34
    h2zero/NimBLE-Arduino@2.5.1

; Opt-in development firmware. The default sticks3 build disables both features.
[env:sticks3-dev]
extends = env:sticks3
build_flags =
    ${env:sticks3.build_flags}
    -DBOOTSWITCH_ENABLE_REMOTE_FLASH=1
    -DBOOTSWITCH_ENABLE_USB_UPDATE=1
